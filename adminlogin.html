<!DOCTYPE html>
<html>
<head>
    <title>Admin Portal</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #76b5c5, #9fc5cf);
    height: 100vh;
}

.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    text-decoration: none;
    background: #d8d8d8;
    padding: 6px 12px;
    border-radius: 6px;
    color: purple;
    font-weight: bold;
}

.login-container {
    width: 350px;
    background: #e9e9e9;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.login-container h2 {
    text-align: center;
    margin-bottom: 20px;
}

label {
    font-size: 14px;
}

.input-box {
    display: flex;
    align-items: center;
    background: #dcdcdc;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.input-box input {
    border: none;
    background: transparent;
    outline: none;
    margin-left: 8px;
    width: 100%;
}

.captcha-text {
    font-size: 14px;
}

.captcha-code {
    color: red;
    font-weight: bold;
}

.captcha-input {
    width: 100%;
    padding: 8px;
    margin: 8px 0 15px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.btn-group {
    display: flex;
    justify-content: space-between;
}

.login-btn {
    background: #1e5db3;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
}

.reset-btn {
    background: #cfcfcf;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
}

.forgot {
    display: block;
    margin-top: 10px;
    font-size: 13px;
    color: #1e5db3;
    text-decoration: none;
    display: flex;
    justify-content: center;
}
a{
    color: black;
}
    </style>

<a style="text-decoration: none;" href="http://127.0.0.1:5500/portal.html" class="back-btn">Back</a>

<div class="login-container">
    <h2>Admin Portal</h2>

    <label>Email ID:</label>
    <div class="input-box">
        <span class="icon">👤</span>
        <input type="text" placeholder="Enter your email id">
    </div>

    <label>Password:</label>
    <div class="input-box">
        <span class="icon">🔒</span>
        <input type="password" placeholder="Enter Password">
    </div>

    <p class="captcha-text">CAPTCHA: <span class="captcha-code">A9xP2</span></p>

    <label>Enter the code:</label>
    <input type="text" class="captcha-input">

    <div class="btn-group">
       <a style="text-decoration: none;" href="http://127.0.0.1:5500/admindashboard.html"> <button class="login-btn">Login</button></a>
        <a style="text-decoration: none;" href="http://127.0.0.1:5500/adminlogin.html"><button class="reset-btn">Reset</button></a>
    </div>

    <a  style="text-decoration: none;" href="http://127.0.0.1:5500/adminforgetpassword.html" class="forgot">Forgot password?</a>
</div>

</body>
</html>
