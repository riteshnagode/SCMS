<!DOCTYPE html>

    <style>
        :root {
    --navy: #0e2a53;
    --blue: #1a73e8;
    --bg: #f8fafc;
    --white: #ffffff;
    --green: #10b981;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg); height: 100vh; overflow: hidden; }

.admin-wrapper { display: flex; height: 100vh; }

.sidebar { width: 280px; background: var(--navy); color: white; padding: 40px 20px; flex-shrink: 0; }
.main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }

.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
.btn-primary { background: var(--blue); color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
.btn-secondary { background: white; border: 1px solid #ddd; padding: 10px 20px; border-radius: 8px; margin-left: 10px; cursor: pointer; }

.user-table-card { background: var(--white); border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
.table-tools { display: flex; justify-content: space-between; margin-bottom: 25px; }
.search-box input { padding: 10px 15px; width: 300px; border-radius: 8px; border: 1px solid #ddd; outline: none; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 15px; color: #64748b; font-size: 0.75rem; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; }
td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }

.user-info { display: flex; align-items: center; gap: 12px; }
.u-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem; font-weight: bold; }
.u-avatar.faculty { background: #6d28d9; }
.u-avatar.student { background: #ef4444; }

.role-tag { background: #f1f5f9; padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 0.75rem; }
.status-dot { position: relative; padding-left: 15px; font-weight: 600; }
.status-dot.active::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; background: var(--green); border-radius: 50%; }

.btn-manage { padding: 6px 12px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
   
   .back{
    margin-left: 40px;
    margin-top: 40px;
    color:black;
    font-size: xx-large;
    font-weight: bolder;
}</style>
</head>
