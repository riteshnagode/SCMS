<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Academic Portal</title>
    <link rel="stylesheet" href="forgetpassword.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>


 <style>:root {
    --primary-navy: #0e2a53;
    --accent-blue: #1a73e8;
    --text-grey: #666;
    --bg-light: #f4f7f9;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background-color: var(--bg-light);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.recovery-container {
    width: 100%;
    max-width: 450px;
    text-align: center;
}

.brand-section {
    margin-bottom: 30px;
}

.logo-placeholder {
    font-size: 3rem;
    margin-bottom: 10px;
}

.brand-section h2 {
    color: var(--primary-navy);
    font-weight: 800;
    letter-spacing: -0.5px;
}

/* Recovery Card Styling */
.recovery-card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(14, 42, 83, 0.08);
    text-align: left;
}

.recovery-card h3 {
    font-size: 1.5rem;
    color: #111;
    margin-bottom: 10px;
}

.recovery-card p {
    font-size: 0.9rem;
    color: var(--text-grey);
    line-height: 1.5;
    margin-bottom: 25px;
}

.input-group {
    margin-bottom: 25px;
}

.input-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--primary-navy);
}

.input-group input {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
}

.input-group input:focus {
    border-color: var(--accent-blue);
}

.btn-reset {
    display: block;
    width: 100%;
    background: var(--primary-navy);
    color: white;
    text-align: center;
    padding: 14px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.3s;
}

.btn-reset:hover {
    background: var(--accent-blue);
}

.footer-links {
    margin-top: 20px;
    text-align: center;
}

.footer-links a {
    text-decoration: none;
    font-size: 0.9rem;
    color: var(--accent-blue);
    font-weight: 600;
}

/* --- No-JS Success Popup Logic --- */
.logic-checkbox {
    display: none;
}

.success-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(14, 42, 83, 0.6);
    backdrop-filter: blur(4px);
    display: none; /* Hidden by default */
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.logic-checkbox:checked ~ .success-overlay {
    display: flex;
}

.popup-box {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    max-width: 350px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.icon-circle {
    font-size: 3rem;
    margin-bottom: 15px;
}

.popup-box h3 {
    margin-bottom: 10px;
    color: var(--primary-navy);
}

.popup-box p {
    font-size: 0.95rem;
    color: var(--text-grey);
}

.close-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 30px;
    background: var(--primary-navy);
    color: white;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

@keyframes scaleIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

 </style>
    <div class="recovery-container">
        <div class="brand-section">
            <div class="logo-placeholder">📖</div>
            <h2>Academic Portal</h2>
        </div>

        <div class="recovery-card">
            <h3>Forgot Password?</h3>
            <p>Enter your Email to receive a password reset link.</p>

            <div class="input-group">
                <label for="user-id">Email</label>
                <input type="text" id="user-id" placeholder="Enter your ID..." required>
            </div>

            <input type="checkbox" id="reset-trigger" class="logic-checkbox">
            
            <label for="reset-trigger" class="btn-reset">Send Recovery Link</label>

            <div class="footer-links">
                <a style="text-decoration: none;" href="http://127.0.0.1:5500/facultylogin.html">← Back to Login</a>
            </div>

            <div class="success-overlay">
                <div class="popup-box">
                    <div class="icon-circle">📩</div>
                    <h3>Link Sent!</h3>
                    <p>A password reset link has been sent to your registered email address. Please check your inbox.</p>
                    <label for="reset-trigger" class="close-btn">Done</label>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
