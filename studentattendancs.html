<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Dashboard</title>
  <link rel="stylesheet" href="studentattendance.css">
</head>
<body>
  <style>
    * {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #0f2f5a;
  display: flex; /* Added to help center the enlarged content */
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px;
}

/* Page - Enlarged version */
.page {
  width: 100%;
  max-width: 1400px; /* Increased from 1000px */
  margin: 0 auto;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

/* Header */
.header {
  background: #183a6b;
  color: white;
  padding: 25px 40px; /* Increased padding */
  font-size: 24px; /* Increased font size */
}

/* Table container */
.table-container {
  padding: 40px; /* Increased padding */
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #e9e9e9;
}

th, td {
  padding: 20px; /* Increased from 12px */
  text-align: center;
  border-bottom: 1px solid #ddd;
  font-size: 1.2rem; /* Enlarged text for readability */
}

th {
  font-weight: bold;
  font-size: 1.3rem;
}

/* Progress bar - Scaled Up */
.progress {
  width: 180px; /* Increased from 120px */
  height: 14px; /* Increased from 10px */
  background: #eee;
  border-radius: 10px;
  margin: 0 auto 8px;
}

.bar {
  height: 100%;
  border-radius: 10px;
}

.good {
  background: #2ecc71;
}

.danger {
  background: #e74c3c;
}

/* Status text */
.good-text {
  color: #2ecc71;
  font-weight: bold;
  font-size: 1.3rem;
}

.danger-text {
  color: #e74c3c;
  font-weight: bold;
  font-size: 1.3rem;
}

a {
  color: white;
  font-weight: bold;
}
  </style>

<div class="page enlarged-container">

  <div class="header">
   <a style="text-decoration: none;" href="http://127.0.0.1:5500/studentdashbord.html">← Attendance</a> 
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Present</th>
          <th>Total</th>
          <th>Percentage</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Mathematics</td>
          <td>42</td>
          <td>48</td>
          <td>
            <div class="progress">
              <div class="bar good" style="width:87.5%"></div>
            </div>
            87.5%
          </td>
          <td class="good-text">GOOD</td>
        </tr>

        <tr>
          <td>Physics</td>
          <td>38</td>
          <td>45</td>
          <td>
            <div class="progress">
              <div class="bar good" style="width:84.4%"></div>
            </div>
            84.4%
          </td>
          <td class="good-text">GOOD</td>
        </tr>

        <tr>
          <td>Chemistry</td>
          <td>40</td>
          <td>44</td>
          <td>
            <div class="progress">
              <div class="bar good" style="width:90.9%"></div>
            </div>
            90.9%
          </td>
          <td class="good-text">GOOD</td>
        </tr>

        <tr>
          <td>Computer Science</td>
          <td>35</td>
          <td>40</td>
          <td>
            <div class="progress">
              <div class="bar good" style="width:87.5%"></div>
            </div>
            87.5%
          </td>
          <td class="good-text">GOOD</td>
        </tr>

        <tr>
          <td>English</td>
          <td>22</td>
          <td>42</td>
          <td>
            <div class="progress">
              <div class="bar danger" style="width:52.3%"></div>
            </div>
            52.3%
          </td>
          <td class="danger-text">DANGER</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
